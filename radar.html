<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vejrradar – nedbør over Danmark</title>
<style>
  :root{
    --page-bg:#14181c;
    --ink:#eef2f5; --muted:#9aa7b1; --line:#3a4652; --accent:#0a5fb4; --stage-bg:#20262c;
    --track-bg:#3a4652; --track-obs:#7fa8d4;
    /* fixed (theme-independent) colors for text that sits on the always-light overlay
       boxes drawn on top of the radar image itself, e.g. .stamp / .legend */
    --overlay-ink:#16212b; --overlay-muted:#5b6b78;
    --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--page-bg)}
  body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .wrap{height:100%;padding:12px 16px;display:flex;flex-direction:column}
  header{flex:none;display:flex;justify-content:flex-end;margin-bottom:12px}
  .updated{font-size:13px;color:var(--muted);text-align:right}
  .updated #clock{font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .stageOuter{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .stage{position:relative;border-radius:8px;overflow:hidden;background:var(--stage-bg);border:1px solid var(--line);aspect-ratio:1980/1580;width:auto;height:auto;max-width:100%;max-height:100%}
  .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block}
  .stage .basemap{position:static;pointer-events:none}
  .stage .frame{opacity:0;transition:opacity .12s linear;pointer-events:none}
  .stage .frame.active{opacity:.85}
  .stamp{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:var(--overlay-ink);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.25;box-shadow:0 1px 3px rgba(20,40,60,.18)}
  .stamp strong{display:block;font-size:20px;font-variant-numeric:tabular-nums}
  .stamp.now strong,.stamp.fc strong{color:var(--accent)}
  .legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--overlay-muted);box-shadow:0 1px 3px rgba(20,40,60,.18)}
  .legend .bar{display:block;height:10px;border-radius:3px;overflow:hidden;margin-bottom:4px;width:150px;background:linear-gradient(90deg,#bfe6fb,#6fb8ec,#3a6fd8,#5a3ab0,#a726c0,#e91e8c)}
  .legend .lab{display:flex;justify-content:space-between}
  .controls{flex:none;display:flex;align-items:center;gap:14px;margin-top:14px}
  button.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none}
  button.play:focus-visible{outline:3px solid #9cc3ec;outline-offset:2px}
  .timeline{flex:1;position:relative;padding-top:10px}
  .track{position:relative;height:6px;border-radius:3px;background:var(--track-bg)}
  .track .obs{position:absolute;left:0;top:0;bottom:0;background:var(--track-obs);border-radius:3px 0 0 3px}
  .now-mark{position:absolute;top:-8px;width:2px;height:22px;background:var(--ink);transform:translateX(-1px)}
  .now-mark::after{content:"Nu";position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;white-space:nowrap}
  input[type=range]{position:absolute;left:0;top:10px;width:100%;margin:0;height:6px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  input[type=range]:focus-visible{outline:3px solid #9cc3ec;outline-offset:6px}
  .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){ .autoplay{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="updated">
      <div id="clock">–</div>
      <div id="updated">Indlæser…</div>
    </div>
  </header>

  <div class="stageOuter">
    <div class="stage" id="stage">
      <img class="basemap" src="https://gfx.tv2a.dk/weather/radar_map_medium.png" alt="Kort over Danmark">
      <div class="stamp" id="stamp"><span id="stampLabel">Observeret</span><strong id="stampTime">–</strong></div>
      <div class="legend">
        <span class="bar"></span>
        <div class="lab"><span>Let</span><span>Moderat</span><span>Kraftig</span></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="play" id="play" aria-label="Afspil"><svg width="18" height="18" viewBox="0 0 18 18" id="playIcon"><path d="M4 2l12 7-12 7z" fill="#fff"/></svg></button>
    <div class="timeline">
      <div class="track"><div class="obs" id="obsBar"></div><div class="now-mark" id="nowMark"></div></div>
      <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Tidspunkt">
      <div class="ticks" id="ticks"></div>
    </div>
  </div>
</div>

<script>
const HIST_FRAMES = 13;      // last ~2h of observed frames, in 10-min steps (incl. the live one)
const MAX_FCST_FRAMES = 12;  // safety cap (2h); actual availability is discovered dynamically
const STEP_MS = 10*60*1000;
const MAX_ANCHOR_RETRIES = 5; // allow for publish lag when finding the latest observed frame

const stage = document.getElementById('stage');
const slider = document.getElementById('slider');
const stamp = document.getElementById('stamp');
const stampTime = document.getElementById('stampTime');
const stampLabel = document.getElementById('stampLabel');
const ticksEl = document.getElementById('ticks');
const updatedEl = document.getElementById('updated');
const playBtn = document.getElementById('play');
const icon = document.getElementById('playIcon');
const obsBar = document.getElementById('obsBar');
const nowMark = document.getElementById('nowMark');
const clockEl = document.getElementById('clock');

const pad = n => String(n).padStart(2,'0');
function floorTo10Utc(d){
  const t = new Date(d.getTime());
  t.setUTCSeconds(0,0);
  t.setUTCMinutes(Math.floor(t.getUTCMinutes()/10)*10);
  return t;
}
function fileStamp(d){
  return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}-${pad(d.getUTCHours())}-${pad(d.getUTCMinutes())}`;
}
function obsUrlFor(d){
  return `https://radar-cdn.weather.tv2api.dk/DmiRadarImages/${fileStamp(d)}-radar-image.png`;
}
function fcstUrlFor(d){
  return `https://radar-cdn.weather.tv2api.dk/RadarPrediction/${fileStamp(d)}-radar-image.png`;
}
function fmtLocal(d){
  return d.toLocaleTimeString('da-DK',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Copenhagen'});
}
function preload(url, bustCache){
  // bustCache is for "does this frame exist yet" probes at the live/forecast frontier:
  // a plain-URL probe against a not-yet-published frame can get its 404 cached by the
  // browser, so re-probing the *same* URL once the frame is actually published can keep
  // returning the stale cached failure forever. A unique query string sidesteps that.
  const src = bustCache ? url+(url.includes('?')?'&':'?')+'cb='+Date.now() : url;
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = ()=>reject(new Error('load failed: '+url));
    img.src = src;
  });
}

let frames = [];      // [{time, ok, forecast, el}]
let nowIdx = HIST_FRAMES-1;
let sliderValue = nowIdx;
let playing = false;
let timer = null;
let lastKey = null; // dedupe: skip rebuild when neither the anchor nor the forecast tail changed

async function findAnchor(){
  let t = floorTo10Utc(new Date());
  for(let i=0;i<MAX_ANCHOR_RETRIES;i++){
    try{ await preload(obsUrlFor(t), true); return t; }
    catch(e){ t = new Date(t.getTime()-STEP_MS); }
  }
  return t;
}

async function findForecast(anchor){
  const times = [];
  for(let i=1;i<=MAX_FCST_FRAMES;i++){
    const t = new Date(anchor.getTime()+i*STEP_MS);
    try{ await preload(fcstUrlFor(t), true); times.push(t); }
    catch(e){ break; }
  }
  return times;
}

async function loadFrames(){
  // always resolved from the real current time, so every call — periodic or manual — reflects "now"
  const anchor = await findAnchor();
  const fcstTimes = await findForecast(anchor);

  const key = anchor.getTime()+'|'+fcstTimes.length+(fcstTimes.length?'|'+fcstTimes[fcstTimes.length-1].getTime():'');
  if(key === lastKey) return; // nothing new published since the last check
  lastKey = key;

  const histTimes = [];
  for(let i=HIST_FRAMES-1;i>=0;i--) histTimes.push(new Date(anchor.getTime() - i*STEP_MS));

  const histResults = await Promise.all(histTimes.map(async (t)=>{
    try{ await preload(obsUrlFor(t)); return {time:t, ok:true, forecast:false}; }
    catch(e){ return {time:t, ok:false, forecast:false}; }
  }));
  const fcstResults = fcstTimes.map(t=>({time:t, ok:true, forecast:true}));

  const combined = histResults.concat(fcstResults);
  nowIdx = HIST_FRAMES-1;

  stage.querySelectorAll('.frame').forEach(n=>n.remove());
  frames = combined.map((r)=>{
    const el = document.createElement('img');
    el.className = 'frame';
    el.alt = '';
    if(r.ok) el.src = r.forecast ? fcstUrlFor(r.time) : obsUrlFor(r.time);
    stage.appendChild(el);
    return {...r, el};
  });

  slider.max = frames.length-1;
  const lagMin = Math.round((Date.now()-anchor.getTime())/60000);
  updatedEl.textContent = `Nyeste radarbillede: ${fmtLocal(anchor)} (${lagMin} min. forsinket)` +
    (fcstTimes.length ? ' · prognose til ' + fmtLocal(fcstTimes[fcstTimes.length-1]) : '');

  const lastIdx = frames.length-1;
  const midIdx = Math.min(lastIdx, Math.max(0, Math.round((0+lastIdx)/2)));
  ticksEl.innerHTML = [0, midIdx, lastIdx]
    .map(i=>`<span${i===nowIdx?' style="color:var(--accent)"':''}>${fmtLocal(frames[i].time)}</span>`).join('');

  const nowPct = lastIdx>0 ? (nowIdx/lastIdx*100) : 100;
  obsBar.style.width = nowPct + '%';
  nowMark.style.left = nowPct + '%';
  nowMark.style.transform = 'translateX(-1px)';

  const preserve = Math.min(sliderValue, lastIdx);
  show(sliderValue >= nowIdx-1 ? nowIdx : preserve);
}

function show(i){
  sliderValue = i;
  frames.forEach((f,idx)=>f.el.classList.toggle('active', idx===i));
  const f = frames[i];
  stampTime.textContent = 'kl. ' + fmtLocal(f.time);
  const isNow = i === nowIdx;
  const isFcst = i > nowIdx;
  stampLabel.textContent = isNow ? 'Seneste' : (isFcst ? 'Prognose' : 'Observeret');
  stamp.classList.toggle('now', isNow);
  stamp.classList.toggle('fc', isFcst);
  slider.value = i;
}

function setPlaying(p){
  playing = p;
  playBtn.setAttribute('aria-label', p?'Pause':'Afspil');
  icon.innerHTML = p
    ? '<rect x="3" y="2" width="4" height="14" fill="#fff"/><rect x="11" y="2" width="4" height="14" fill="#fff"/>'
    : '<path d="M4 2l12 7-12 7z" fill="#fff"/>';
  clearInterval(timer);
  if(p) timer = setInterval(()=>show((sliderValue+1)%frames.length), 450);
}
playBtn.onclick = ()=>setPlaying(!playing);
slider.oninput = ()=>{ setPlaying(false); show(+slider.value); };

function tickClock(){
  clockEl.textContent = 'Nu kl. ' + fmtLocal(new Date());
}
tickClock();
setInterval(tickClock, 1000);

async function init(){
  await loadFrames();
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches) setPlaying(true);
}
init();
// check every minute so the "Nu" timestamp and frame URLs pick up newly published
// data as soon as it appears (new frames publish roughly every 10 min); loadFrames()
// is a no-op when nothing new has shown up yet
setInterval(loadFrames, 60*1000);
</script>
</body>
</html>
